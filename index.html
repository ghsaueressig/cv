<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        h1 {
            font-size: 2em;
            color: #2c3e50;
            text-align: center;
        }
        h2 {
            font-size: 1.5em;
            color: #34495e;
            margin-top: 30px;
        }
        p {
            font-size: 1em;
        }
        .aligned-content {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .aligned-content img {
            margin-right: 10px;
            width: 30px;
            height: 30px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .social-links a {
            margin: 0 10px;
        }
        .social-links a img {
            width: 40px;
            height: 40px;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        section {
            margin-bottom: 30px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 20px 0;
        }
        @media (max-width: 600px) {
            .social-links a img {
                width: 25px;
                height: 25px;
            }
        }
    </style>
